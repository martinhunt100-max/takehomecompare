<!DOCTYPE html><html lang="en"><head>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">
<link rel="icon" type="image/png" href="/assets/icon-512.png" sizes="512x512">

<meta property="og:title" content="Take Home Compare">
<meta property="og:description" content="Compare your expected take-home pay across states and countries in seconds.">
<meta property="og:image" content="/assets/og-image.png">
<meta property="og:url" content="https://takehomecompare.com">
<meta name="twitter:card" content="summary_large_image">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take Home Compare</title>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
</head><body>
<header><div class="wrap header-inner"><div></div><img class="logo" src="assets/logo.png" alt="Take Home Compare"><div class="cta"><a class="btn" href="advanced-v2.html">Advanced Calculator →</a></div></div></header>
<div class="wrap" style="text-align:center;margin-top:6px;color:var(--muted)"><div id="tagline">Compare your expected <strong>take‑home pay</strong> across states and countries in seconds.</div></div>
<main class="wrap">
  <section class="card">
    <div class="two-col">
      <div>
        <h3 style="margin:0 0 8px">Location A</h3>
        <label>Country / US state</label>
        <select id="locA"></select>
        <label style="margin-top:8px;display:block">Gross annual salary</label>
        <input id="grossA" type="number" placeholder="e.g. 90000" value="90000">
        <label style="margin-top:8px;display:block">Filing / Plan</label>
        <select id="optA"><option value="single">US: Single</option><option value="married">US: Married</option><option value="uk-plan2">UK: Student Loan Plan 2</option><option value="uk-none">UK: No Student Loan</option></select>
        <label style="margin-top:8px;display:block">Pre-tax pension (%)</label>
        <input id="penA" type="number" value="5">
        <div class="kpis">
          <div class="chip">Net monthly: <b id="netA">—</b> <small id="ccyA"></small></div>
          <div class="chip">Eff. tax: <b id="effA">—</b></div>
        </div>
      </div>
      <div>
        <h3 style="margin:0 0 8px">Location B</h3>
        <label>Country / US state</label>
        <select id="locB"></select>
        <label style="margin-top:8px;display:block">Gross annual salary</label>
        <input id="grossB" type="number" placeholder="e.g. 90000" value="90000">
        <label style="margin-top:8px;display:block">Filing / Plan</label>
        <select id="optB"><option value="single">US: Single</option><option value="married">US: Married</option><option value="uk-plan2">UK: Student Loan Plan 2</option><option value="uk-none">UK: No Student Loan</option></select>
        <label style="margin-top:8px;display:block">Pre-tax pension (%)</label>
        <input id="penB" type="number" value="5">
        <div class="kpis">
          <div class="chip">Net monthly: <b id="netB">—</b> <small id="ccyB"></small></div>
          <div class="chip">Eff. tax: <b id="effB">—</b></div>
        </div>
      </div>
    </div>
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn" id="calc">Calculate & Compare</button>
      <button class="btn-ghost" id="swap">Swap A ↔ B</button>
      <button class="btn-ghost" id="copyAB">Copy A → B</button>
      <button class="btn-ghost" id="baselineB">Make B my baseline</button>
      <span id="diffBadge" class="badge" style="display:none"></span>
    </div>
    <div id="deltaRow" class="delta-row" style="display:none">
      <span class="delta" id="deltaMonthly"></span>
      <span class="delta" id="deltaAnnual"></span>
      <span id="deltaNote" style="color:var(--muted)"></span>
    </div>
  </section>
</main>
<footer>© 2025 TakeHomeCompare.com • <span id="ver">v?</span> • <span id="upd">—</span></footer>
<script>
let RATES=null, LOCS=null;
(async()=>{
  RATES = await getRates();
  LOCS = await loadLocations();
  const a=document.getElementById('locA'), b=document.getElementById('locB');
  buildLocationOptions(a,LOCS); buildLocationOptions(b,LOCS);
  const r = await fetch('/api/rates'); if(r.ok){ const j=await r.json(); document.getElementById('ver').textContent=j.version||'v?'; document.getElementById('upd').textContent=new Date(j.updated||Date.now()).toLocaleString(); }
})();

function computeFor(locCode, gross, opt){
  let ccy = codeToCurrency(locCode);
  let net=gross; let eff=0;
  if(locCode.startsWith('US') || locCode==='USA'){
    const filing = (opt==='married') ? 'married' : 'single';
    const baseTaxable = gross;
    const fed = computeBrackets(baseTaxable, (RATES?.US?.federal?.brackets?.[filing]||[]));
    const fica = (Math.min(baseTaxable, (RATES?.US?.FICA?.social_security_cap||0))*(RATES?.US?.FICA?.social_security_rate||0)) + (baseTaxable*(RATES?.US?.FICA?.medicare_rate||0));
    net = baseTaxable - fed - fica; eff = 1 - (net/Math.max(1,gross)); ccy='USD';
  } else if (locCode==='GBR'){ net=gross*0.75; eff=0.25; }
  else if (locCode==='IRL'){ net=gross*0.72; eff=0.28; }
  else { net=gross*0.78; eff=0.22; }
  return {monthly: net/12, eff, ccy};
}
function setValues(prefix, res){
  document.getElementById('net'+prefix).textContent = currency(res.monthly, res.ccy);
  document.getElementById('eff'+prefix).textContent = Math.round(res.eff*100)+'%';
  document.getElementById('ccy'+prefix).textContent = res.ccy;
}
function getInputs(prefix){
  return {
    loc: document.getElementById('loc'+prefix).value,
    gross: Number(document.getElementById('gross'+prefix).value||0),
    opt: document.getElementById('opt'+prefix).value,
    pen: Number(document.getElementById('pen'+prefix).value||0)
  };
}
function setInputs(prefix, data){
  document.getElementById('loc'+prefix).value = data.loc;
  document.getElementById('gross'+prefix).value = data.gross;
  document.getElementById('opt'+prefix).value = data.opt;
  document.getElementById('pen'+prefix).value = data.pen;
}
function updateDiff(a,b){
  const badge = document.getElementById('diffBadge');
  const row = document.getElementById('deltaRow');
  const m = document.getElementById('deltaMonthly');
  const y = document.getElementById('deltaAnnual');
  const note = document.getElementById('deltaNote');
  const sameCcy = a.ccy === b.ccy;
  if(!sameCcy){ badge.style.display='none'; row.style.display='none'; return; }
  const deltaM = b.monthly - a.monthly;
  const sign = deltaM>=0 ? '+' : '−';
  badge.textContent = `B vs A: ${sign}${currency(Math.abs(deltaM), a.ccy)}/mo`;
  badge.style.display = 'inline-block';
  m.textContent = `Monthly difference: ${sign}${currency(Math.abs(deltaM), a.ccy)}`;
  y.textContent = `Annual difference: ${sign}${currency(Math.abs(deltaM*12), a.ccy)}`;
  note.textContent = `(Positive = B higher take‑home)`;
  row.style.display = 'flex';
}
function recalc(){
  const Ain = getInputs('A'), Bin = getInputs('B');
  const A = computeFor(Ain.loc, Ain.gross, Ain.opt);
  const B = computeFor(Bin.loc, Bin.gross, Bin.opt);
  setValues('A', A); setValues('B', B); updateDiff(A,B);
}
document.getElementById('calc').addEventListener('click', recalc);
document.getElementById('swap').addEventListener('click', ()=>{ const A = getInputs('A'); const B = getInputs('B'); setInputs('A', B); setInputs('B', A); recalc(); });
document.getElementById('copyAB').addEventListener('click', ()=>{ const A = getInputs('A'); setInputs('B', A); recalc(); });
document.getElementById('baselineB').addEventListener('click', ()=>{ const B = getInputs('B'); setInputs('A', B); recalc(); });
</script>
</body></html>
