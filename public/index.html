  <footer>
    © 2025 TakeHomeCompare.com • <span id="ver">v?</span> • <span id="upd">—</span>
  </footer>

  <!-- Load helpers first -->
  <script src="/shared.js"></script>

  <!-- App logic (inline to avoid MIME/caching issues) -->
  <script>
  let RATES = null;

  function computeFor(locCode, gross, opt){
    let ccy = codeToCurrency(locCode);
    let net = Number(gross)||0, eff = 0;

    if (locCode.startsWith('US') || locCode === 'USA'){
      const filing = (opt === 'married') ? 'married' : 'single';
      const baseTaxable = net;
      const fed = computeBrackets(baseTaxable, (RATES?.US?.federal?.brackets?.[filing]||[]));
      const fica = (Math.min(baseTaxable, (RATES?.US?.FICA?.social_security_cap||0))*(RATES?.US?.FICA?.social_security_rate||0))
                 + (baseTaxable*(RATES?.US?.FICA?.medicare_rate||0));
      net = baseTaxable - fed - fica; 
      eff = 1 - (net/Math.max(1, baseTaxable));
      ccy = 'USD';
    } else if (locCode === 'GBR'){ net *= 0.75; eff = 0.25; ccy='GBP'; }
      else if (locCode === 'IRL'){ net *= 0.72; eff = 0.28; ccy='EUR'; }
      else { net *= 0.78; eff = 0.22; }

    return { monthly: net/12, eff, ccy };
  }

  function setValues(prefix, res){
    document.getElementById('net'+prefix).textContent = currency(res.monthly, res.ccy);
    document.getElementById('eff'+prefix).textContent = Math.round(res.eff*100)+'%';
    const ccyEl = document.getElementById('ccy'+prefix);
    if (ccyEl) ccyEl.textContent = res.ccy;
  }

  function getInputs(prefix){
    return {
      loc: document.getElementById('loc'+prefix).value,
      gross: Number(document.getElementById('gross'+prefix).value||0),
      opt: document.getElementById('opt'+prefix).value,
      pen: Number(document.getElementById('pen'+prefix).value||0)
    };
  }

  function setInputs(prefix, data){
    document.getElementById('loc'+prefix).value = data.loc;
    document.getElementById('gross'+prefix).value = data.gross;
    document.getElementById('opt'+prefix).value = data.opt;
    document.getElementById('pen'+prefix).value = data.pen;
  }

  function updateDiff(a,b){
    const badge = document.getElementById('diffBadge');
    const row = document.getElementById('deltaRow');
    const m = document.getElementById('deltaMonthly');
    const y = document.getElementById('deltaAnnual');
    const note = document.getElementById('deltaNote');
    const sameCcy = a.ccy === b.ccy;
    if(!sameCcy){ if(badge) badge.style.display='none'; if(row) row.style.display='none'; return; }
    const deltaM = b.monthly - a.monthly;
    const sign = deltaM>=0 ? '+' : '−';
    if (badge){ badge.textContent = `B vs A: ${sign}${currency(Math.abs(deltaM), a.ccy)}/mo`; badge.style.display = 'inline-block'; }
    if (m) m.textContent = `Monthly difference: ${sign}${currency(Math.abs(deltaM), a.ccy)}`;
    if (y) y.textContent = `Annual difference: ${sign}${currency(Math.abs(deltaM*12), a.ccy)}`;
    if (note) note.textContent = `(Positive = B higher take-home)`;
    if (row) row.style.display = 'flex';
  }

  function recalc(){
    const Ain = getInputs('A'), Bin = getInputs('B');
    const A = computeFor(Ain.loc, Ain.gross, Ain.opt);
    const B = computeFor(Bin.loc, Bin.gross, Bin.opt);
    setValues('A', A); setValues('B', B); updateDiff(A,B);
  }

  async function startCheckout(){
    try{
      const r = await fetch('/api/create-checkout-session', { method:'POST' });
      if(!r.ok){ alert('Could not start checkout'); return; }
      const j = await r.json();
      if (j.url) { window.location = j.url; }
      else { alert('No checkout URL returned'); }
    }catch(e){ alert('Checkout failed'); }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    // Ordered locations: US, states, UK, Europe, rest
    const LOCS = await loadLocations();
    const a = document.getElementById('locA');
    const b = document.getElementById('locB');
    buildLocationOptions(a, LOCS, 'USA');
    buildLocationOptions(b, LOCS, 'GBR');

    // Rates + footer version
    try {
      RATES = await getRates();
      const r = await fetch('/api/rates', {cache:'no-store'});
      if (r.ok){
        const j = await r.json();
        const verEl = document.getElementById('ver');
        const updEl = document.getElementById('upd');
        if (verEl) verEl.textContent = j.version || 'v?';
        if (updEl) updEl.textContent = new Date(j.updated || Date.now()).toLocaleString();
      }
    } catch(e){}

    // Wire controls
    document.getElementById('calc').addEventListener('click', recalc);
    document.getElementById('swap').addEventListener('click', ()=>{ const A = getInputs('A'); const B = getInputs('B'); setInputs('A', B); setInputs('B', A); recalc(); });
    document.getElementById('copyAB').addEventListener('click', ()=>{ const A = getInputs('A'); setInputs('B', A); recalc(); });
    document.getElementById('baselineB').addEventListener('click', ()=>{ const B = getInputs('B'); setInputs('A', B); recalc(); });
    const goPro = document.getElementById('goPro'); if(goPro) goPro.addEventListener('click', startCheckout);
  });
  </script>
</body>
</html>
