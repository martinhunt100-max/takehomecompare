<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Take Home Compare</title>

  <!-- Brand font -->
  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/base.css" />

  <!-- Icons & social -->
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">
  <link rel="icon" type="image/png" href="/assets/icon-512.png" sizes="512x512">
  <meta property="og:title" content="Take Home Compare">
  <meta property="og:description" content="Compare your expected take-home pay across states and countries in seconds.">
  <meta property="og:image" content="/assets/og-image.png">
  <meta property="og:url" content="https://takehomecompare.com">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    body { font-family: 'Signika', sans-serif; background: #f9f9f9; margin: 0; padding: 0; color: #333; }
    header { background: white; padding: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 50; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 1rem; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { max-height: 52px; }
    .logo-wrap {
  flex: 1;
  text-align: center;
}

.logo {
  max-height: 60px;
  height: auto;
  width: auto;
  object-fit: contain;
  display: inline-block;
}

@media (max-width: 700px) {
  .header-inner {
    flex-direction: column;
    gap: 0.8rem;
  }
  .logo-wrap {
    text-align: center;
    width: 100%;
  }
  .logo {
    max-height: 70px;
    width: auto;
  }
}

    .btn { background: #007a3d; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: #009b4e; }
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); padding: 1rem; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 700px){ .two-col { grid-template-columns: 1fr; } }
    label { display: block; margin-top: 0.6rem; font-size: 0.9rem; }
    input, select { width: 100%; padding: 0.4rem; border: 1px solid #ccc; border-radius: 6px; margin-top: 0.3rem; font-size: 1rem; }
    .controls { margin-top: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .kpis { margin-top: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .chip { background: #f4f4f4; padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.9rem; }
    .badge { background: #007a3d; color: white; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.9rem; margin-left: 0.5rem; }
    footer { text-align: center; font-size: 0.85rem; color: #777; margin-top: 2rem; padding: 2rem 1rem; }
  </style>
</head>

<body>
  <header>
  <div class="wrap header-inner">
    <div class="logo-wrap">
      <img class="logo" src="/assets/logo.png" alt="Take Home Compare" />
    </div>
    <button class="btn" id="goPro">Advanced Calculator →</button>
  </div>
</header>


  <div class="wrap tagline">
    <p style="font-size:1.1rem;text-align:center;color:#007a3d;margin-top:0.5rem;">
      Compare your expected <strong>take-home pay</strong> across states and countries in seconds.
    </p>
  </div>

  <main class="wrap">
    <section class="card">
      <div class="two-col">
        <!-- Column A -->
        <div>
          <h3>Location A</h3>
          <label>Country / US state</label>
          <select id="locA"></select>

          <label>Gross annual salary</label>
          <input id="grossA" type="number" placeholder="e.g. 90000" value="90000" />

          <label>Filing / Plan</label>
          <select id="optA">
            <option value="single">US: Single</option>
            <option value="married">US: Married</option>
            <option value="uk-plan2">UK: Student Loan Plan 2</option>
            <option value="uk-none">UK: No Student Loan</option>
          </select>

          <label>Pre-tax pension (%)</label>
          <input id="penA" type="number" value="5" />

          <div class="kpis">
            <div class="chip">Net monthly: <b id="netA">—</b> <small id="ccyA"></small></div>
            <div class="chip">Eff. tax: <b id="effA">—</b></div>
          </div>
        </div>

        <!-- Column B -->
        <div>
          <h3>Location B</h3>
          <label>Country / US state</label>
          <select id="locB"></select>

          <label>Gross annual salary</label>
          <input id="grossB" type="number" placeholder="e.g. 90000" value="90000" />

          <label>Filing / Plan</label>
          <select id="optB">
            <option value="single">US: Single</option>
            <option value="married">US: Married</option>
            <option value="uk-plan2">UK: Student Loan Plan 2</option>
            <option value="uk-none">UK: No Student Loan</option>
          </select>

          <label>Pre-tax pension (%)</label>
          <input id="penB" type="number" value="5" />

          <div class="kpis">
            <div class="chip">Net monthly: <b id="netB">—</b> <small id="ccyB"></small></div>
            <div class="chip">Eff. tax: <b id="effB">—</b></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="calc">Calculate & Compare</button>
        <span id="diffBadge" class="badge" style="display:none"></span>
      </div>

      <div id="deltaRow" class="delta-row" style="display:none">
        <span class="delta" id="deltaMonthly"></span>
        <span class="delta" id="deltaAnnual"></span>
        <span id="deltaNote" class="muted"></span>
      </div>
    </section>
  </main>

  <footer>
    © 2025 TakeHomeCompare.com • <span id="ver">v?</span> • <span id="upd">—</span>
  </footer>

  <!-- Load helpers -->
  <script src="/shared.js"></script>

  <!-- Inline app logic -->
  <script>
  let RATES = null;

  function computeFor(locCode, gross, opt){
    let ccy = codeToCurrency(locCode);
    let net = Number(gross)||0, eff = 0;

    if (locCode.startsWith('US') || locCode === 'USA'){
      const filing = (opt === 'married') ? 'married' : 'single';
      const baseTaxable = net;
      const fed = computeBrackets(baseTaxable, (RATES?.US?.federal?.brackets?.[filing]||[]));
      const fica = (Math.min(baseTaxable, (RATES?.US?.FICA?.social_security_cap||0))*(RATES?.US?.FICA?.social_security_rate||0))
                 + (baseTaxable*(RATES?.US?.FICA?.medicare_rate||0));
      net = baseTaxable - fed - fica; 
      eff = 1 - (net/Math.max(1, baseTaxable));
      ccy = 'USD';
    } else if (locCode === 'GBR'){ net *= 0.75; eff = 0.25; ccy='GBP'; }
      else if (locCode === 'IRL'){ net *= 0.72; eff = 0.28; ccy='EUR'; }
      else { net *= 0.78; eff = 0.22; }

    return { monthly: net/12, eff, ccy };
  }

  function setValues(prefix, res){
    document.getElementById('net'+prefix).textContent = currency(res.monthly, res.ccy);
    document.getElementById('eff'+prefix).textContent = Math.round(res.eff*100)+'%';
    const ccyEl = document.getElementById('ccy'+prefix);
    if (ccyEl) ccyEl.textContent = res.ccy;
  }

  function getInputs(prefix){
    return {
      loc: document.getElementById('loc'+prefix).value,
      gross: Number(document.getElementById('gross'+prefix).value||0),
      opt: document.getElementById('opt'+prefix).value,
      pen: Number(document.getElementById('pen'+prefix).value||0)
    };
  }

  function updateDiff(a,b){
    const badge = document.getElementById('diffBadge');
    const row = document.getElementById('deltaRow');
    const m = document.getElementById('deltaMonthly');
    const y = document.getElementById('deltaAnnual');
    const note = document.getElementById('deltaNote');
    const sameCcy = a.ccy === b.ccy;
    if(!sameCcy){ if(badge) badge.style.display='none'; if(row) row.style.display='none'; return; }
    const deltaM = b.monthly - a.monthly;
    const sign = deltaM>=0 ? '+' : '−';
    if (badge){ badge.textContent = `B vs A: ${sign}${currency(Math.abs(deltaM), a.ccy)}/mo`; badge.style.display = 'inline-block'; }
    if (m) m.textContent = `Monthly difference: ${sign}${currency(Math.abs(deltaM), a.ccy)}`;
    if (y) y.textContent = `Annual difference: ${sign}${currency(Math.abs(deltaM*12), a.ccy)}`;
    if (note) note.textContent = `(Positive = B higher take-home)`;
    if (row) row.style.display = 'flex';
  }

  function recalc(){
    const Ain = getInputs('A'), Bin = getInputs('B');
    const A = computeFor(Ain.loc, Ain.gross, Ain.opt);
    const B = computeFor(Bin.loc, Bin.gross, Bin.opt);
    setValues('A', A); setValues('B', B); updateDiff(A,B);
  }

  async function startCheckout(){
    try{
      const r = await fetch('/api/create-checkout-session', { method:'POST' });
      if(!r.ok){ alert('Could not start checkout'); return; }
      const j = await r.json();
      if (j.url) { window.location = j.url; }
      else { alert('No checkout URL returned'); }
    }catch(e){ alert('Checkout failed'); }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const LOCS = await loadLocations();
    const a = document.getElementById('locA');
    const b = document.getElementById('locB');
    if (!a || !b) { console.warn('Selects not found'); return; }
    buildLocationOptions(a, LOCS, 'USA');
    buildLocationOptions(b, LOCS, 'GBR');

    try {
      RATES = await getRates();
      const r = await fetch('/api/rates', {cache:'no-store'});
      if (r.ok){
        const j = await r.json();
        const verEl = document.getElementById('ver');
        const updEl = document.getElementById('upd');
        if (verEl) verEl.textContent = j.version || 'v?';
        if (updEl) updEl.textContent = new Date(j.updated || Date.now()).toLocaleString();
      }
    } catch(e){}

    document.getElementById('calc').addEventListener('click', recalc);
    document.getElementById('goPro').addEventListener('click', startCheckout);
  });
  </script>
</body>
</html>
