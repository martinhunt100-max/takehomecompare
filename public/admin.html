<!DOCTYPE html>
<html lang="en"><head>
<link rel="icon" href="/favicon.ico">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Take Home Compare</title>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="/favicon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="stylesheet" href="/base.css">
<style>
.admin-card{max-width:800px;margin:20px auto}
textarea{width:100%;min-height:90px;padding:12px;border-radius:10px;border:1px solid rgba(0,0,0,.12);font-family:inherit}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
@media(max-width:720px){.row{grid-template-columns:1fr}}
.token{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,.12)}
.note{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="wrap header-inner">
    <div></div>
    <img class="logo" src="/assets/logo.png" alt="Take Home Compare">
    <div class="cta"><a href="/" class="btn">← Back</a></div>
  </div>
</header>
<main class="wrap">
  <section class="card admin-card">
    <h2>Site copy</h2>
    <p class="note">Enter your admin token (set in Cloudflare Pages env: <code>ADMIN_TOKEN</code>) once and it will be remembered in this browser.</p>
    <div class="row">
      <input id="token" class="token" placeholder="Admin token"><button class="btn" id="saveToken">Save token</button>
    </div>
    <div style="height:12px"></div>
    <div><label>Header tagline (plain text)</label><textarea id="tagline"></textarea></div>
    <div><label>Advanced line (HTML allowed for the link)</label><textarea id="advanced"></textarea><p class="note">Tip: keep it short; link only the words “Click here”.</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="load">Load current</button><button class="btn" id="save">Save changes</button></div>
  </section>
</main>
<footer>© 2025 TakeHomeCompare.com</footer>
<script>
const tokenInput=document.getElementById('token'); const tagline=document.getElementById('tagline'); const advanced=document.getElementById('advanced');
tokenInput.value=localStorage.getItem('thc_admin_token')||'';
document.getElementById('saveToken').onclick=()=>{ localStorage.setItem('thc_admin_token', tokenInput.value.trim()); alert('Token saved.'); };
document.getElementById('load').onclick=async()=>{ const t=localStorage.getItem('thc_admin_token')||tokenInput.value.trim(); const res=await fetch('/api/admin-copy',{ headers: t?{ 'authorization':'Bearer '+t }:{} }); if(!res.ok){ alert('Load failed'); return; } const data=await res.json(); tagline.value=data.tagline||''; advanced.value=data.advanced_line_html||''; };
document.getElementById('save').onclick=async()=>{ const t=localStorage.getItem('thc_admin_token')||tokenInput.value.trim(); const res=await fetch('/api/admin-copy',{ method:'POST', headers:Object.assign({ 'content-type':'application/json' }, t?{ 'authorization':'Bearer '+t }:{}), body: JSON.stringify({ tagline:tagline.value, advanced_line_html:advanced.value }) }); if(!res.ok){ alert('Save failed'); return; } alert('Saved to KV.'); };
</script>
</body></html>
