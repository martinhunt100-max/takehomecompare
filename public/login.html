<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Take Home Compare</title>
  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Signika', sans-serif; background:#f9f9f9; margin:0; color:#333 }
    .wrap { max-width: 420px; margin: 8vh auto; background:#fff; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:20px }
    h1 { margin:0 0 8px }
    label { display:block; margin-top:10px }
    input { width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; margin-top:6px; font-size:1rem }
    button { background:#007a3d; color:#fff; border:0; border-radius:10px; padding:10px 14px; font-weight:700; cursor:pointer; margin-top:12px }
    .muted{ color:#777; font-size:.95rem }
    .msg{ margin-top:12px; white-space:pre-wrap }
    a { color:#0a6 }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Sign in</h1>
    <p class="muted">We’ll email you a magic link to sign in. No password needed.</p>
    <label>Email address</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
    <button id="send">Email me a sign-in link</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
  document.getElementById('send').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const msg = document.getElementById('msg');
    if (!email) { msg.textContent = 'Enter a valid email.'; return; }
    msg.textContent = 'Sending…';
    const r = await fetch('/api/auth/request-link', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ email })
    });
    const j = await r.json().catch(()=>({}));
    if (!r.ok) { msg.textContent = 'Error: ' + (j.error || 'failed'); return; }
    if (j.dev_link) {
      msg.innerHTML = 'Dev mode: magic link created.<br><a href="'+j.dev_link+'">Click here to sign in</a>';
    } else {
      msg.textContent = 'Check your email for the sign-in link.';
    }
  });
  </script>
</body>
</html>
