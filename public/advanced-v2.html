<!DOCTYPE html>
<html lang="en"><head>
<link rel="icon" href="/favicon.ico">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced — Take Home Compare</title>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="/favicon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="stylesheet" href="base.css">
<script src="shared.js" defer></script>
</head>
<body>
<header>
  <div class="wrap header-inner">
    <div></div>
    <img class="logo" src="assets/logo.png" alt="Take Home Compare">
    <div class="cta">
      <form id="planForm" style="display:flex;gap:8px;align-items:center">
        <select id="plan"><option value="monthly">Pro — Monthly</option><option value="annual">Pro — Annual</option></select>
        <button class="btn" id="upgradeBtn" type="button">Upgrade</button>
      </form>
    </div>
  </div>
</header>
<div class="wrap" style="text-align:center;margin-top:6px;color:var(--muted)">
  <div>Advanced tools: multi-location compare, locals, COL adjust, PDF/email, save & share.</div>
</div>
<main class="wrap">
  <section class="card">
    <div class="grid-3">
      <div>
        <label>Country</label>
        <select id="country1"><option>US</option><option>UK</option><option>IE</option></select>
        <label>Gross</label>
        <input id="gross1" type="number" value="90000">
      </div>
      <div>
        <label>Compare with</label>
        <select id="country2"><option>US</option><option>UK</option><option>IE</option></select>
        <label>Gross</label>
        <input id="gross2" type="number" value="90000">
      </div>
      <div>
        <label>US State</label>
        <select id="usState"><option value="">(none)</option><option value="CA">California</option><option value="NY">New York</option><option value="PA">Pennsylvania</option><option value="MI">Michigan</option><option value="MO">Missouri</option><option value="OH">Ohio</option><option value="TX">Texas</option></select>
        <label>City / Local</label>
        <select id="usCity"><option value="">(none)</option></select>
      </div>
    </div>

    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="calc">Calculate</button>
      <button class="btn" id="save">Save scenario</button>
      <button class="btn" id="pdf">Download PDF</button>
      <button class="btn" id="email">Email my results</button>
    </div>

    <details class="accordion" id="proBreakdown">
      <summary>Breakdown, trends & comparisons</summary>
      <div class="content">
        <canvas id="proBars" height="240"></canvas>
        <div style="height:10px"></div>
        <canvas id="spark1" height="120"></canvas>
      </div>
    </details>
  </section>
</main>
<footer>© 2025 TakeHomeCompare.com • <span id="ver">v?</span> • <span id="upd">—</span></footer>
<script>
(async()=>{
  const r = await fetch('/api/rates'); if(r.ok){ const j=await r.json(); document.getElementById('ver').textContent=j.version||'v?'; document.getElementById('upd').textContent=new Date(j.updated||Date.now()).toLocaleString(); }
  if(!localStorage.getItem('thc_pro')){
    document.getElementById('save').onclick = ()=>alert('Pro feature — please upgrade.');
    document.getElementById('pdf').onclick = ()=>alert('Pro feature — please upgrade.');
    document.getElementById('email').onclick = ()=>alert('Pro feature — please upgrade.');
  }
  const base = await getRates();
  const usStates = base?.US?.states || {};
  const stateSel = document.getElementById('usState');
  const citySel = document.getElementById('usCity');
  stateSel.addEventListener('change', ()=>{
    const code = stateSel.value;
    citySel.innerHTML = '<option value="">(none)</option>';
    if(!code || !usStates[code] || !usStates[code].locals) return;
    for(const k of Object.keys(usStates[code].locals)){
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = usStates[code].locals[k].name;
      citySel.appendChild(opt);
    }
  });

  document.getElementById('calc').addEventListener('click', async ()=>{
    await loadChartJs();
    new Chart(document.getElementById('proBars'),{type:'bar', data:{labels:['Location A','Location B'], datasets:[{data:[100,92]}]}, options:{plugins:{legend:{display:false}}, responsive:true, maintainAspectRatio:false}});
    new Chart(document.getElementById('spark1'),{type:'line', data:{labels:['y1','y2','y3','y4','y5'], datasets:[{data:[80,82,81,85,90], fill:false, tension:.35}]}, options:{plugins:{legend:{display:false}}, elements:{point:{radius:0}}, scales:{x:{display:false},y:{display:false}}, responsive:true, maintainAspectRatio:false}});
  });

  document.getElementById('upgradeBtn').addEventListener('click', async ()=>{
    const plan = document.getElementById('plan').value;
    const res = await fetch('/api/create-checkout-session', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ plan }) });
    if(!res.ok){ alert('Checkout failed'); return; }
    const data = await res.json();
    if(data.url) location.href = data.url; else alert('No URL from Stripe');
  });
})();
</script>
</body></html>
