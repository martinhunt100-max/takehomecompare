<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advanced — Take Home Compare</title>

  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/base.css" />

  <!-- Icons & social -->
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">
  <link rel="icon" type="image/png" href="/assets/icon-512.png" sizes="512x512">
  <meta property="og:title" content="Take Home Compare — Advanced">
  <meta property="og:description" content="Side-by-side take-home pay comparison with advanced options.">
  <meta property="og:image" content="/assets/og-image.png">
  <meta property="og:url" content="https://takehomecompare.com/advanced-v2.html">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    body { font-family: 'Signika', sans-serif; background:#f9f9f9; color:#333; margin:0 }
    header { background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.05) }
    .wrap { max-width: 1100px; margin:0 auto; padding:16px }
    .header-inner { display:flex; align-items:center; gap:12px; justify-content:space-between }
    .logo { max-height: 60px; height:auto; width:auto; object-fit:contain }
    .btn { background:#007a3d; color:#fff; border:0; border-radius:10px; padding:10px 14px; font-weight:700; cursor:pointer }
    .btn:hover{ background:#009b4e }
    .btn-ghost{ background:#fff; border:1px solid #ddd; border-radius:10px; padding:8px 12px; cursor:pointer }
    .card { background:#fff; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px; }
    .two-col {
      display:grid;
      grid-template-columns: 1fr 1fr;   /* always two columns */
      gap:14px;
    }
    /* keep two columns even on small widths; allow horizontal scroll if needed */
    .card { overflow-x:auto }
    .col { min-width: 320px }  /* prevents over-shrinking */
    label { display:block; margin-top:8px; font-size:.92rem; color:#355 }
    input, select { width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; margin-top:4px; font-size:1rem; background:#fff }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px }
    .kpis { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap }
    .chip{ background:#f4f4f4; border-radius:999px; padding:6px 10px; }
    .controls{ display:flex; gap:10px; align-items:center; margin-top:12px }
    .badge { background:#007a3d; color:#fff; padding:4px 8px; border-radius:8px; display:none }
    .muted { color:#6a7 }
    .note { background:#fff7e6; border:1px solid #f0d49a; padding:10px 12px; border-radius:10px; margin:12px 0; }
    footer{ text-align:center; color:#777; padding:20px 12px }
  </style>
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <div class="logo-wrap"><img class="logo" src="/assets/logo.png" alt="Take Home Compare"></div>
      <a class="btn-ghost" href="/">← Back</a>
    </div>
  </header>

  <main class="wrap">
    <!-- Pro status banner -->
    <div id="proBanner" class="note" style="display:none"></div>

    <section class="card">
      <div class="two-col">
        <!-- A -->
        <div class="col">
          <h3>Location A</h3>

          <label>Country / US state</label>
          <select id="loc1"></select>

          <label>Gross annual salary</label>
          <input id="gross1" type="number" value="90000" />

          <!-- Advanced-only -->
          <div id="advA">
            <div class="row">
              <div>
                <label>US Filing</label>
                <select id="filing1">
                  <option value="single">Single</option>
                  <option value="married">Married</option>
                </select>
              </div>
              <div>
                <label>Pre-tax pension (%)</label>
                <input id="pen1" type="number" value="5">
              </div>
            </div>
            <div class="row">
              <div>
                <label>UK Student Loan</label>
                <select id="ukloan1">
                  <option value="none">None</option>
                  <option value="plan2">Plan 2</option>
                  <option value="plan1">Plan 1</option>
                  <option value="plan4">Plan 4</option>
                  <option value="pg">Postgrad</option>
                </select>
              </div>
              <div>
                <label>Local add-on (demo)</label>
                <select id="local1">
                  <option value="none">None</option>
                  <option value="nyc">NYC</option>
                </select>
              </div>
            </div>
          </div>

          <div class="kpis">
            <div class="chip">Net monthly: <b id="net1">—</b> <small id="ccy1"></small></div>
            <div class="chip">Eff. tax: <b id="eff1">—</b></div>
          </div>
        </div>

        <!-- B -->
        <div class="col">
          <h3>Location B</h3>

          <label>Country / US state</label>
          <select id="loc2"></select>

          <label>Gross annual salary</label>
          <input id="gross2" type="number" value="90000" />

          <!-- Advanced-only -->
          <div id="advB">
            <div class="row">
              <div>
                <label>US Filing</label>
                <select id="filing2">
                  <option value="single">Single</option>
                  <option value="married">Married</option>
                </select>
              </div>
              <div>
                <label>Pre-tax pension (%)</label>
                <input id="pen2" type="number" value="5">
              </div>
            </div>
            <div class="row">
              <div>
                <label>UK Student Loan</label>
                <select id="ukloan2">
                  <option value="none">None</option>
                  <option value="plan2">Plan 2</option>
                  <option value="plan1">Plan 1</option>
                  <option value="plan4">Plan 4</option>
                  <option value="pg">Postgrad</option>
                </select>
              </div>
              <div>
                <label>Local add-on (demo)</label>
                <select id="local2">
                  <option value="none">None</option>
                  <option value="nyc">NYC</option>
                </select>
              </div>
            </div>
          </div>

          <div class="kpis">
            <div class="chip">Net monthly: <b id="net2">—</b> <small id="ccy2"></small></div>
            <div class="chip">Eff. tax: <b id="eff2">—</b></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="calc">Calculate</button>
        <span id="badge" class="badge"></span>
      </div>

      <div id="deltaRow" class="note" style="display:none">
        <strong id="deltaMonthly"></strong> • <span id="deltaAnnual"></span>
        <span id="deltaNote" class="muted"></span>
      </div>
    </section>
  </main>

  <footer>© 2025 TakeHomeCompare.com</footer>

  <!-- Shared helpers -->
  <script src="/shared.js"></script>

  <!-- Page logic -->
  <script>
  // ---- Pro gating: ?pro=1 OR localStorage.pro === '1'
  (function ensureProFlag(){
    const u = new URL(location.href);
    if (u.searchParams.get('pro') === '1') localStorage.setItem('pro','1');
  })();

  const isPro = (new URL(location.href)).searchParams.get('pro') === '1' || localStorage.getItem('pro') === '1';

  function showProBanner(){
    const b = document.getElementById('proBanner');
    if (!b) return;
    if (isPro){
      b.style.display = 'block';
      b.textContent = '✅ Pro active — advanced fields unlocked.';
    } else {
      b.style.display = 'block';
      b.innerHTML = '🔓 You are viewing the free fields. <a href="/" style="color:#0a6; text-decoration:underline">Upgrade</a> to unlock advanced inputs and richer outputs.';
      // Hide advanced field containers
      document.getElementById('advA').style.display='none';
      document.getElementById('advB').style.display='none';
    }
  }

  // ---- Minimal compute (reuses helpers from shared.js: currency, computeBrackets, codeToCurrency)
  let RATES = null;

  function computeFor(locCode, gross, opts){
    let ccy = codeToCurrency(locCode);
    let base = Number(gross)||0;

    // Pension (reduce taxable base, not FICA by default)
    const penPct = (opts?.pen || 0) / 100;
    const pension = Math.max(0, base * penPct);
    const taxable = Math.max(0, base - pension);

    let net = base; // start from base income

    if (locCode.startsWith('US') || locCode === 'USA'){
      const filing = (opts?.filing === 'married') ? 'married' : 'single';
      const fed = computeBrackets(taxable, (RATES?.US?.federal?.brackets?.[filing]||[]));
      const fica = (Math.min(base, (RATES?.US?.FICA?.social_security_cap||0))*(RATES?.US?.FICA?.social_security_rate||0))
                 + (base*(RATES?.US?.FICA?.medicare_rate||0));
      let local = 0;
      if (opts?.local === 'nyc') local = base * 0.03876; // demo local
      net = base - fed - fica - local;
      ccy = 'USD';
    } else if (locCode === 'GBR'){
      // very simplified placeholders for demo
      const tax = taxable * 0.2; // basic
      const ni  = base * 0.12;
      // student loan demo
      let sl = 0; if (opts?.ukloan && opts.ukloan !== 'none') sl = Math.max(0, base - 27295) * 0.09;
      net = base - tax - ni - sl;
      ccy='GBP';
    } else if (locCode === 'IRL'){
      const tax = taxable * 0.2; const usc = base * 0.045;
      net = base - tax - usc; ccy='EUR';
    } else {
      net = base * 0.78; // generic placeholder
    }

    const eff = 1 - (net / Math.max(1, base));
    return { monthly: net/12, eff, ccy };
  }

  function display(prefix, res){
    document.getElementById('net'+prefix).textContent = currency(res.monthly, res.ccy);
    document.getElementById('eff'+prefix).textContent = Math.round(res.eff*100) + '%';
    const ccyEl = document.getElementById('ccy'+prefix);
    if (ccyEl) ccyEl.textContent = res.ccy;
  }

  function inputs(side){
    const idx = side === 'A' ? '1' : '2';
    return {
      loc: document.getElementById('loc'+idx).value,
      gross: document.getElementById('gross'+idx).value,
      filing: document.getElementById('filing'+idx)?.value || 'single',
      pen: Number(document.getElementById('pen'+idx)?.value || 0),
      ukloan: document.getElementById('ukloan'+idx)?.value || 'none',
      local: document.getElementById('local'+idx)?.value || 'none'
    };
  }

  function delta(a,b){
    const badge = document.getElementById('badge');
    const row = document.getElementById('deltaRow');
    const m = document.getElementById('deltaMonthly');
    const y = document.getElementById('deltaAnnual');
    const note = document.getElementById('deltaNote');

    if (a.ccy !== b.ccy){
      badge.style.display='none'; row.style.display='none'; return;
    }
    const d = b.monthly - a.monthly;
    const sign = d>=0 ? '+' : '−';
    badge.textContent = `B vs A: ${sign}${currency(Math.abs(d), a.ccy)}/mo`;
    badge.style.display='inline-block';
    m.textContent = `Monthly difference: ${sign}${currency(Math.abs(d), a.ccy)}`;
    y.textContent = `Annual difference: ${sign}${currency(Math.abs(d*12), a.ccy)}`;
    note.textContent = '(Positive = B higher take-home)';
    row.style.display='block';
  }

  window.addEventListener('DOMContentLoaded', async () => {
    showProBanner();

    // Load parameters and locations
    try { RATES = await getRates(); } catch(e){}
    const LOCS = await loadLocations();
    buildLocationOptions(document.getElementById('loc1'), LOCS, 'USA');
    buildLocationOptions(document.getElementById('loc2'), LOCS, 'GBR');

    // If not pro, hide advanced fields (already hidden in banner); calculate still works with base inputs
    document.getElementById('calc').addEventListener('click', () => {
      const A = inputs('A');
      const B = inputs('B');

      const resA = computeFor(A.loc, A.gross, isPro ? A : {});  // only apply advanced knobs if pro
      const resB = computeFor(B.loc, B.gross, isPro ? B : {});
      display('1', resA);
      display('2', resB);
      delta(resA, resB);
    });
  });
  </script>
</body>
</html>
