name = "takehomecompare"
compatibility_date = "2024-11-21"

# 👇 This line makes Pages treat wrangler.toml as the source of truth
pages_build_output_dir = "public"

# Optional defaults (UI env vars override these in production)
[vars]
SUCCESS_URL = "https://takehomecompare.com/advanced-v2.html?pro=1"
CANCEL_URL  = "https://takehomecompare.com/advanced-v2.html"

# Your daily cron (Pages won’t show a Triggers UI, but this is honored)
[triggers]
crons = ["0 6 * * 1-5"]

# KV binding (keep this; also bind in the UI so production has credentials)
[[kv_namespaces]]
binding   = "RATES_KV"
id        = "REPLACE_WITH_PRODUCTION_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_ID"
